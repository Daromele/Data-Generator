          return React.createElement('header', { className: "bg-white dark:bg-slate-800/50 shadow-md backdrop-blur-sm sticky top-0 z-10" },
              React.createElement('div', { className: "container mx-auto px-4 md:px-8 py-4 flex flex-wrap items-center justify-between gap-4" },
                  React.createElement('div', { className: "flex items-center gap-4" },
                      React.createElement(DatabaseIcon, { className: "w-8 h-8 text-indigo-500" }),
                      React.createElement('h1', { className: "text-2xl font-bold text-slate-800 dark:text-white tracking-tight" }, "Realistic Data Generator")
                  ),
                  React.createElement('div', { className: "relative w-full sm:w-auto" },
                      React.createElement('input', {
                          type: "password",
                          placeholder: "Enter Gemini API Key here",
                          value: apiKey,
                          onChange: (e) => setApiKey(e.target.value),
                          className: "px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none dark:bg-slate-900 dark:border-slate-600 w-full sm:w-80",
                          "aria-label": "Gemini API Key"
                      })
                  )
              )
          );
      };

      const PreviewTable = ({ data, isLoading, headers, columnWidths, onColumnReorder, onColumnResize }) => {
          const previewData = data.slice(0, 15);
          const [draggedHeader, setDraggedHeader] = useState(null);
          const [dropTarget, setDropTarget] = useState(null);
          const resizingColumnRef = useRef(null);
      
          const handleDrop = (targetHeader) => {
              if (!draggedHeader || draggedHeader === targetHeader) {
                  setDraggedHeader(null);
                  return;
              }
              const draggedIndex = headers.indexOf(draggedHeader);
              const targetIndex = headers.indexOf(targetHeader);
      
              const newHeaders = [...headers];
              const [removed] = newHeaders.splice(draggedIndex, 1);
              newHeaders.splice(targetIndex, 0, removed);
      
              onColumnReorder(newHeaders);
          };
      
          const handleDragEnd = () => {
              setDraggedHeader(null);
              setDropTarget(null);
          }
      
          const handleMouseMove = useCallback((e) => {
              if (!resizingColumnRef.current) return;
      
              const { id, startWidth, startX } = resizingColumnRef.current;
              const deltaX = e.clientX - startX;
              const newWidth = Math.max(100, startWidth + deltaX);
      
              onColumnResize(id, newWidth);
          }, [onColumnResize]);
      
          const handleMouseUp = useCallback(() => {
              window.removeEventListener('mousemove', handleMouseMove);
              window.removeEventListener('mouseup', handleMouseUp);
              resizingColumnRef.current = null;
          }, [handleMouseMove]);
      
          const handleResizeMouseDown = (e, headerId) => {
              e.preventDefault();
              e.stopPropagation();
      
              const thElement = e.target.closest('th');
              if (!thElement) return;
      
              resizingColumnRef.current = {
                  id: headerId,
                  startWidth: thElement.offsetWidth,
                  startX: e.clientX,
              };
      
              window.addEventListener('mousemove', handleMouseMove);
              window.addEventListener('mouseup', handleMouseUp);
          };
      
          if (isLoading) {
              return React.createElement('div', { className: "flex items-center justify-center h-96 text-slate-500 dark:text-slate-400" },
                  React.createElement('svg', { className: "animate-spin mr-3 h-6 w-6", xmlns: "http://www.w3.org/2000/svg", fill: "none", viewBox: "0 0 24 24" },
                      React.createElement('circle', { className: "opacity-25", cx: "12", cy: "12", r: "10", stroke: "currentColor", strokeWidth: "4" }),
                      React.createElement('path', { className: "opacity-75", fill: "currentColor", d: "M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" })
                  ),
                  React.createElement('span', null, "Generating your data...")
              );
          }
      
          if (previewData.length === 0) {
              return React.createElement('div', { className: "flex flex-col items-center justify-center h-96 text-center text-slate-500 dark:text-slate-400 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-lg p-4" },
                  React.createElement('p', { className: "text-lg font-semibold mb-2" }, "No data generated yet."),
                  React.createElement('p', { className: "text-sm" }, "Use the AI prompt or the manual controls to generate some data.")
              );
          }
      
          return React.createElement('div', { className: "flex-grow overflow-auto border border-slate-200 dark:border-slate-700 rounded-lg" },
              React.createElement('table', { className: "min-w-full divide-y divide-slate-200 dark:divide-slate-700 table-fixed" },
                  React.createElement('thead', { className: "bg-slate-50 dark:bg-slate-900/50 sticky top-0 z-10" },
                      React.createElement('tr', null, headers.map((key) => React.createElement('th', {
                          key: key,
                          scope: "col",
                          draggable: true,
                          onDragStart: () => setDraggedHeader(key),
                          onDragEnd: handleDragEnd,
                          onDragEnter: () => setDropTarget(key),
                          onDragOver: (e) => e.preventDefault(),
                          onDrop: () => handleDrop(key),
                          style: { width: columnWidths[key] ? `${columnWidths[key]}px` : 'auto' },
                          className: `relative px-6 py-3 text-left text-xs font-medium text-slate-500 dark:text-slate-300 uppercase tracking-wider select-none ${draggedHeader ? 'cursor-grabbing' : 'cursor-grab'} ${dropTarget === key && draggedHeader !== key ? 'bg-indigo-100 dark:bg-indigo-900/80' : ''}`
                      },
                          React.createElement('div', { className: "truncate" }, key.replace(/_/g, ' ')),
                          React.createElement('div', { className: "absolute top-0 right-0 h-full w-1.5 cursor-col-resize select-none", onMouseDown: (e) => handleResizeMouseDown(e, key) })
                      )))
                  ),
                  React.createElement('tbody', { className: "bg-white dark:bg-slate-800 divide-y divide-slate-200 dark:divide-slate-700" },
                      previewData.map((row, index) => React.createElement('tr', { key: index, className: "hover:bg-slate-50 dark:hover:bg-slate-700/50" },
                          headers.map((header) => React.createElement('td', { key: `${index}-${header}`, className: "px-6 py-4 whitespace-nowrap text-sm text-slate-600 dark:text-slate-400 truncate" }, String(row[header])))
                      ))
                  )
              )
          );
      };

      // --- Main App Component ---

      const App = () => {
          const [config, setConfig] = useState({
              category: 'E-commerce',
              numRows: 100,
              format: 'json',
              complexity: 'simple',
              seed: Math.floor(Math.random() * 10000),
              selectedFields: [],
          });
          const [apiKey, setApiKey] = useState('');
          const [columnWidths, setColumnWidths] = useState({});
          const [generatedData, setGeneratedData] = useState([]);
          const [isLoading, setIsLoading] = useState(false);
          const [aiPrompt, setAiPrompt] = useState('');
          const [isAiLoading, setIsAiLoading] = useState(false);
          const [aiError, setAiError] = useState(null);
          const [shouldGenerateAfterAi, setShouldGenerateAfterAi] = useState(false);
      
          const availableFields = useMemo(() => {
              if (!config.category) return [];
              const categoryFields = CATEGORIES[config.category][config.complexity];
              return ALL_FIELDS.filter(field => categoryFields.includes(field.id));
          }, [config.category, config.complexity]);
      
          useEffect(() => {
              const key = `datagen-prefs-${config.category}-${config.complexity}`;
              const savedPrefs = localStorage.getItem(key);
      
              let initialFields = CATEGORIES[config.category][config.complexity];
              let initialWidths = {};
      
              if (savedPrefs) {
                  try {
                      const { order, widths } = JSON.parse(savedPrefs);
                      if (Array.isArray(order) && typeof widths === 'object') {
                          const availableFieldIds = CATEGORIES[config.category][config.complexity];
                          const validOrder = order.filter((fieldId) => availableFieldIds.includes(fieldId));
                          const newFields = availableFieldIds.filter(fieldId => !validOrder.includes(fieldId));
                          initialFields = [...validOrder, ...newFields];
                          initialWidths = widths || {};
                      }
                  } catch (e) {
                      console.error("Failed to parse saved preferences:", e);
                  }
              }
      
              setConfig(prev => ({ ...prev, selectedFields: initialFields }));
              setColumnWidths(initialWidths);
          }, [config.category, config.complexity]);
      
          useEffect(() => {
              if (config.selectedFields.length === 0) return;
              const key = `datagen-prefs-${config.category}-${config.complexity}`;
              const prefs = { order: config.selectedFields, widths: columnWidths };
              localStorage.setItem(key, JSON.stringify(prefs));
          }, [config.selectedFields, columnWidths, config.category, config.complexity]);
      
          const handleConfigChange = useCallback((key, value) => {
              setConfig(prev => ({ ...prev, [key]: value }));
          }, []);
      
          const handleFieldSelectionChange = (fieldId) => {
              setConfig(prev => {
                  const newSelectedFields = prev.selectedFields.includes(fieldId) ?
                      prev.selectedFields.filter(id => id !== fieldId) :
                      [...prev.selectedFields, fieldId];
                  return { ...prev, selectedFields: newSelectedFields };
              });
          };
      
          const handleColumnReorder = (newOrder) => {
              setConfig(prev => ({ ...prev, selectedFields: newOrder }));
          };
      
          const handleColumnResize = (fieldId, width) => {
              setColumnWidths(prev => ({ ...prev, [fieldId]: width }));
          };
      
          const handleGenerateData = useCallback(() => {
              setIsLoading(true);
              setGeneratedData([]);
              setTimeout(() => {
                  const data = generateData(config);
                  setGeneratedData(data);
                  setIsLoading(false);
              }, 50);
          }, [config]);
      
          const downloadFile = (content, fileName, contentType) => {
              const a = document.createElement("a");
              const file = new Blob([content], { type: contentType });
              a.href = URL.createObjectURL(file);
              a.download = fileName;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(a.href);
          };
      
          const handleDownload = (format) => {
              if (generatedData.length === 0) return;
              if (format === 'json') {
                  const jsonString = JSON.stringify(generatedData, null, 2);
                  downloadFile(jsonString, `data-${new Date().getTime()}.json`, 'application/json');
              } else if (format === 'csv') {
                  const csv = Papa.unparse(generatedData);
                  downloadFile(csv, `data-${new Date().getTime()}.csv`, 'text/csv');
              }
          };
      
          const handleAiConfiguration = useCallback(async () => {
              if (!apiKey) {
                  setAiError("Please enter your Gemini API Key in the header.");
                  return;
              }
      
              setIsAiLoading(true);
              setAiError(null);
      
              try {
                  const ai = new GoogleGenAI(apiKey);
                  const model = ai.getGenerativeModel({ model: "gemini-1.5-flash" }); // Use a standard model name
      
                  const schema = {
                      type: Type.OBJECT,
                      properties: {
                          category: { type: Type.STRING, enum: Object.keys(CATEGORIES), description: 'The best data category for the user\'s request.' },
                          numRows: { type: Type.INTEGER, description: 'The number of data rows to generate. Default to a reasonable number if not specified.' },
                          complexity: { type: Type.STRING, enum: ['simple', 'detailed'], description: 'The level of detail for the data. Choose "detailed" if the user asks for more specific fields.' },
                          selectedFields: { type: Type.ARRAY, items: { type: Type.STRING }, description: 'An array of field IDs that best match the user\'s request. These IDs must exist in the chosen category and complexity.' }
                      },
                      required: ['category', 'numRows', 'complexity', 'selectedFields']
                  };
      
                  const prompt = `You are an expert data generation assistant. Your task is to interpret the user's request and configure the data generation parameters accordingly. You must return a valid JSON object that adheres to the provided schema. Here are the available categories and their fields for 'simple' and 'detailed' complexity levels: ${JSON.stringify(CATEGORIES, null, 2)}. Here is a complete list of all possible field IDs and their descriptions: ${JSON.stringify(ALL_FIELDS, null, 2)}. Based on the user's request below, provide a JSON configuration object. Ensure the 'category' is one of the valid options. Determine an appropriate 'numRows' (between 10 and 10000). Choose the 'complexity' ('simple' or 'detailed') that best fits the request. The 'selectedFields' array must only contain valid field IDs from the chosen category and complexity. User Request: "${aiPrompt}"`;
                  
                  // Note: The original SDK call syntax was non-standard.
                  // This is an adaptation to the standard GenAI SDK.
                  const result = await model.generateContent({
                      contents: [{ role: "user", parts: [{ text: prompt }] }],
                      generationConfig: {
                          responseMimeType: "application/json",
                          responseSchema: schema,
                      }
                  });
                  
                  const response = result.response;
                  const aiConfig = JSON.parse(response.text());
      
                  if (!aiConfig.category || !CATEGORIES[aiConfig.category]) {
                      throw new Error("AI returned an invalid category.");
                  }
      
                  setConfig(prev => ({ ...prev, category: aiConfig.category, numRows: Math.min(Math.max(aiConfig.numRows, 10), 10000), complexity: aiConfig.complexity, selectedFields: aiConfig.selectedFields, seed: Math.floor(Math.random() * 10000) }));
                  setShouldGenerateAfterAi(true);
      
              } catch (error) {
                  console.error("Error generating configuration with AI:", error);
                  setAiError("Failed to generate configuration. Please check your prompt or API Key and try again.");
              } finally {
                  setIsAiLoading(false);
              }
          }, [aiPrompt, apiKey]);
      
          useEffect(() => {
              if (shouldGenerateAfterAi) {
                  handleGenerateData();
                  setShouldGenerateAfterAi(false);
              }
          }, [shouldGenerateAfterAi, handleGenerateData]);
      
          return React.createElement('div', { className: "min-h-screen font-sans text-slate-800 dark:text-slate-200" },
              React.createElement(Header, { apiKey, setApiKey }),
              React.createElement('main', { className: "container mx-auto p-4 md:p-8" },
                  React.createElement('div', { className: "grid grid-cols-1 lg:grid-cols-12 gap-8" },
                      React.createElement('div', { className: "lg:col-span-4 xl:col-span-3 space-y-8" },
                          React.createElement(AIConfigurator, { prompt: aiPrompt, setPrompt: setAiPrompt, onGenerate: handleAiConfiguration, isLoading: isAiLoading, error: aiError }),
                          React.createElement(CategorySelector, { selectedCategory: config.category, onSelectCategory: (category) => handleConfigChange('category', category) }),
                          React.createElement(ConfigPanel, { config, availableFields, onConfigChange: handleConfigChange, onFieldSelectionChange: handleFieldSelectionChange, onGenerate: handleGenerateData, isLoading: isLoading })
                      ),
                      React.createElement('div', { className: "lg:col-span-8 xl:col-span-9" },
                          React.createElement('div', { className: "bg-white dark:bg-slate-800 rounded-xl shadow-lg p-6 h-full flex flex-col" },
                              React.createElement('div', { className: "flex justify-between items-center mb-4 flex-wrap gap-4" },
                                  React.createElement('h2', { className: "text-xl font-bold text-slate-700 dark:text-slate-200" }, "Data Preview"),
                                  React.createElement(DownloadButtons, { onDownload: handleDownload, isDataGenerated: generatedData.length > 0 })
                              ),
                              React.createElement(PreviewTable, { data: generatedData, isLoading: isLoading, headers: config.selectedFields, columnWidths, onColumnReorder: handleColumnReorder, onColumnResize: handleColumnResize })
                          )
                      )
                  )
              )
          );
      };

      // --- Render the App ---
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(React.createElement(React.StrictMode, null, React.createElement(App)));

    </script>
  </body>
</html>
