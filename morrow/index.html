<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Morrow</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c8b7a' stroke-width='1.5' stroke-linecap='round'%3e%3cpath d='M12 21c0-6 2-9 6-11'/%3e%3cpath d='M12 21c0-5-1.5-8-5-10'/%3e%3cpath d='M12 21V9'/%3e%3ccircle cx='12' cy='5' r='2.5'/%3e%3c/svg%3e" />
<style>
  :root {
    --bg: #f6f5f1;
    --ink: #2c2f2b;
    --soft: #6d716a;
    --line: #e2e0d8;
    --card: #fffefb;
    --accent: #6f8268;
    --accent-soft: #eef1e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a; --ink: #e6e5e0; --soft: #9a9d96; --line: #2a2d2f;
      --card: #1d2022; --accent: #93ab8a; --accent-soft: #232825;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.55 ui-serif, Georgia, "Iowan Old Style", serif;
    display: flex; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    width: 100%; max-width: 680px; height: 100%;
    display: flex; flex-direction: column;
    padding: 0 20px env(safe-area-inset-bottom);
  }

  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 26px 2px 10px;
  }
  header h1 {
    font-size: 19px; font-weight: 500; letter-spacing: .06em;
    margin: 0; text-transform: lowercase;
  }
  header .tag { color: var(--soft); font-size: 13px; font-family: ui-sans-serif, system-ui, sans-serif; }

  /* The only persistent on-screen note: one approaching real deadline. */
  #whisper {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 12.5px; color: var(--soft);
    padding: 0 2px 10px; border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center;
  }
  #whisper::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); flex: none; opacity: .7;
  }

  #stream { flex: 1; overflow-y: auto; padding: 18px 0 8px; scroll-behavior: smooth; }
  .msg { display: flex; margin: 0 0 16px; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 88%; }
  .msg.user .bubble {
    background: var(--accent-soft); border-radius: 16px 16px 4px 16px;
    padding: 9px 14px; font-size: 15px;
  }
  .msg.morrow .bubble { color: var(--ink); }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }

  .options { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .option {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
  }
  .option-text { font-size: 15px; }
  .option-meta {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11.5px; color: var(--soft); margin-top: 4px; letter-spacing: .02em;
  }
  .option-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .option-actions button, .chip {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px;
    background: transparent; color: var(--soft);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 11px; cursor: pointer;
  }
  .option-actions button:hover { color: var(--ink); border-color: var(--accent); }

  .aside {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 13px; color: var(--soft); margin-top: 10px;
  }

  #context { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 2px 8px; }
  #context.empty { display: none; }
  .chip { background: var(--accent-soft); border-color: transparent; }
  .chip.clear { background: transparent; }

  #composer {
    display: flex; align-items: flex-end; gap: 8px;
    border-top: 1px solid var(--line); padding: 12px 0 18px;
  }
  #input {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    color: var(--ink); font: inherit; font-size: 16px; max-height: 180px; padding: 8px 2px;
  }
  #input::placeholder { color: var(--soft); }
  .icon {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); background: transparent; color: var(--soft);
    cursor: pointer; display: grid; place-items: center;
  }
  .icon.on { color: var(--accent); border-color: var(--accent); }
  .icon:disabled { opacity: .35; cursor: default; }
  .icon svg { width: 17px; height: 17px; }
  #send { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
  <div id="app">
    <header>
      <h1>morrow</h1>
      <span class="tag">capture freely · show selectively</span>
    </header>
    <div id="whisper" hidden></div>
    <div id="stream"></div>
    <div id="context" class="empty"></div>
    <form id="composer">
      <button type="button" id="mic" class="icon" title="Speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/>
        </svg>
      </button>
      <button type="button" id="speak" class="icon" title="Speak replies aloud">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9a4 4 0 0 1 0 6"/>
        </svg>
      </button>
      <textarea id="input" rows="1" placeholder="Say anything. Nothing becomes a task on its own."></textarea>
      <button type="submit" id="send" class="icon" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h15M13 6l6 6-6 6"/>
        </svg>
      </button>
    </form>
  </div>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
