<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morrow</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a4631f' stroke-width='1.5' stroke-linecap='round'%3e%3cpath d='M12 21c0-6 2-9 6-11'/%3e%3cpath d='M12 21c0-5-1.5-8-5-10'/%3e%3cpath d='M12 21V9'/%3e%3ccircle cx='12' cy='5' r='2.5'/%3e%3c/svg%3e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground:      #e8e9ec;
    --surface:     #f4f5f7;
    --ink:         #1b1d23;
    --soft:        #6a6e78;
    --line:        #d3d6dc;
    --line-strong: #bfc4cd;
    /* The lamp. Real, externally imposed deadlines and focus rings only. */
    --lamp:        #a4631f;
    --lamp-quiet:  #efe3d6;

    --speech: "Newsreader", ui-serif, Georgia, "Iowan Old Style", serif;
    --data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --step: 0.6rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14161a; --surface: #1c1f24; --ink: #dee0e5; --soft: #8b909a;
      --line: #272b31; --line-strong: #363b43; --lamp: #d99a5b; --lamp-quiet: #2b2119;
    }
  }
  :root[data-theme="dark"] {
    --ground: #14161a; --surface: #1c1f24; --ink: #dee0e5; --soft: #8b909a;
    --line: #272b31; --line-strong: #363b43; --lamp: #d99a5b; --lamp-quiet: #2b2119;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--speech); font-size: 17px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; display: flex; justify-content: center;
  }
  #app { width: 100%; max-width: 40rem; height: 100%; display: flex; flex-direction: column; padding: 0 1.25rem; }

  header { display: flex; align-items: baseline; gap: 0.75rem; padding: 1.75rem 0 0.6rem; flex: none; }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 500; letter-spacing: 0.02em; font-variant: small-caps; }
  .creed { font-family: var(--data); font-size: 0.66rem; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--soft); }
  #link { margin-left: auto; font-family: var(--data); font-size: 0.62rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); }
  #link.down { color: var(--lamp); }

  /* The one persistent line: the nearest real deadline. */
  #whisper {
    flex: none; display: flex; align-items: baseline; gap: 0.6rem;
    font-family: var(--data); font-size: 0.72rem; color: var(--lamp);
    padding: 0.5rem 0 0.55rem 0.7rem; border-left: 2px solid var(--lamp);
    background: var(--lamp-quiet); border-radius: 0 3px 3px 0; margin-bottom: 0.35rem;
  }
  #whisper[hidden] { display: none; }
  #whisper .when { margin-left: auto; padding-left: 0.75rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

  #stream { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 1.1rem 0 0.5rem;
    display: flex; flex-direction: column; gap: 1.15rem; }
  .turn { display: flex; animation: rise 0.4s cubic-bezier(.22,.8,.3,1) both; }
  .turn.said { justify-content: flex-end; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .turn { animation: none; } }

  .body { max-width: 90%; white-space: pre-wrap; }
  .said .body {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px 14px 3px 14px; padding: 0.5rem 0.85rem;
    font-size: 0.95rem; color: var(--soft); white-space: pre-wrap;
  }

  /* What Morrow is doing behind the reply - present, but never loud. */
  .doing { font-family: var(--data); font-size: 0.66rem; letter-spacing: 0.04em;
    color: var(--soft); opacity: .8; display: flex; gap: 0.5rem; align-items: baseline; }
  .doing::before { content: ''; width: 4px; height: 4px; border-radius: 50%;
    background: var(--soft); flex: none; transform: translateY(-2px); }
  .thinking::after {
    content: ''; display: inline-block; width: 0.45em; height: 0.45em; margin-left: 0.15em;
    border-radius: 50%; background: currentColor; animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  .ask {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 2px solid var(--lamp); border-radius: 3px 10px 10px 3px;
    padding: 0.75rem 0.9rem; max-width: 90%;
  }
  .ask .why { font-size: 0.95rem; margin-bottom: 0.5rem; }
  .ask pre {
    font-family: var(--data); font-size: 0.68rem; line-height: 1.7; color: var(--soft);
    margin: 0 0 0.7rem; white-space: pre-wrap; word-break: break-all;
    max-height: 11rem; overflow-y: auto;
  }
  .moves { display: flex; gap: var(--step); flex-wrap: wrap; }

  button {
    font-family: var(--data); font-size: 0.7rem; color: var(--soft);
    background: transparent; border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 0.25rem 0.7rem; cursor: pointer; transition: color .15s, border-color .15s;
  }
  button:hover:not(:disabled) { color: var(--ink); border-color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }
  .go { color: var(--lamp); border-color: var(--lamp); }
  :focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

  #state { flex: none; display: flex; gap: var(--step); flex-wrap: wrap; padding-bottom: 0.6rem; }
  #state[hidden] { display: none; }
  .flag { font-family: var(--data); font-size: 0.68rem; color: var(--soft);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0.2rem 0.65rem; }

  #composer { flex: none; display: flex; align-items: flex-end; gap: var(--step);
    border-top: 1px solid var(--line); padding: 0.7rem 0 1.1rem; }
  #input { flex: 1; resize: none; border: 0; outline: none; background: transparent;
    color: var(--ink); font-family: var(--speech); font-size: 1rem; line-height: 1.5;
    max-height: 11rem; padding: 0.45rem 0.15rem; }
  #input::placeholder { color: var(--soft); opacity: .75; }
  .key { flex: none; width: 2.3rem; height: 2.3rem; display: grid; place-items: center;
    border-radius: 50%; border: 1px solid var(--line-strong); background: transparent;
    color: var(--soft); cursor: pointer; padding: 0; }
  .key svg { width: 1rem; height: 1rem; }
  .key:hover:not(:disabled) { color: var(--ink); border-color: var(--ink); }
  .key.live { color: var(--lamp); border-color: var(--lamp); }
  .key:disabled { opacity: .3; cursor: default; }
  #send { color: var(--ink); border-color: var(--ink); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Morrow</h1>
    <span class="creed">capture freely · show selectively</span>
    <span id="link">connecting</span>
  </header>

  <div id="whisper" hidden></div>
  <div id="stream" aria-live="polite"></div>
  <div id="state" hidden></div>

  <form id="composer" autocomplete="off">
    <button type="button" id="mic" class="key" title="Speak" aria-label="Speak">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.2 11a6.8 6.8 0 0 0 13.6 0"/><path d="M12 17.8V21.5"/>
      </svg>
    </button>
    <button type="button" id="speak" class="key" title="Read replies aloud" aria-label="Read replies aloud">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.2v5.6h3.6L13 19V5L7.6 9.2H4z"/><path d="M16.6 9.4a3.7 3.7 0 0 1 0 5.2"/>
      </svg>
    </button>
    <textarea id="input" rows="1" placeholder="Say anything. Nothing becomes a task on its own."></textarea>
    <button type="submit" id="send" class="key" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12h14M12.5 6.5 19 12l-6.5 5.5"/>
      </svg>
    </button>
  </form>
</div>

<script>
/* The page decides nothing. It carries what the person says to the agent and
   renders what comes back; every judgement about what any of it means is made
   by the model on the other end of this stream. */

const $ = s => document.querySelector(s);
const stream = $('#stream');
let speakAloud = false;
let replying = null;      // the assistant bubble currently being streamed into
let busy = false;

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

function turn(cls) {
  const row = el('div', 'turn ' + cls);
  stream.appendChild(row);
  stream.scrollTop = stream.scrollHeight;
  return row;
}

function said(text) {
  turn('said').appendChild(el('div', 'body', text));
  stream.scrollTop = stream.scrollHeight;
}

function heard() {
  const row = turn('heard');
  const body = el('div', 'body thinking');
  row.appendChild(body);
  return body;
}

// The waiting bubble is a placeholder, not content: drop it the moment
// something real takes its place.
function clearPlaceholder() {
  if (replying && !replying.textContent) {
    const row = replying.parentElement;
    if (row) row.remove();
  }
  replying = null;
}

function doing(label) {
  clearPlaceholder();
  const row = turn('heard');
  row.appendChild(el('div', 'doing', label));
  stream.scrollTop = stream.scrollHeight;
}

// Nothing on disk changes without this card being answered.
function askApproval(a) {
  const row = turn('heard');
  const card = el('div', 'ask');
  card.appendChild(el('div', 'why', a.op));
  card.appendChild(el('pre', null, (a.preview || []).join('\n')));
  const moves = el('div', 'moves');
  const yes = el('button', 'go', 'do it');
  const no = el('button', null, 'no');
  const settle = (approved, note) => {
    yes.disabled = no.disabled = true;
    fetch('/approve', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token: a.token, approved })
    });
    moves.replaceChildren(el('span', 'doing', note));
  };
  yes.onclick = () => settle(true, 'done');
  no.onclick = () => settle(false, 'left alone');
  moves.append(yes, no);
  card.appendChild(moves);
  row.appendChild(card);
  stream.scrollTop = stream.scrollHeight;
}

function paintState(ctx) {
  const strip = $('#state');
  const flags = [];
  if (ctx && ctx.mode) flags.push(ctx.mode);
  if (ctx && ctx.energy) flags.push(ctx.energy + ' energy');
  if (ctx && ctx.minutes) flags.push(ctx.minutes + ' min');
  strip.replaceChildren(...flags.map(f => el('span', 'flag', f)));
  strip.hidden = !flags.length;
}

function paintWhisper(deadlines) {
  const w = $('#whisper');
  const next = (deadlines || [])[0];
  if (!next) { w.hidden = true; return; }
  const d = next.in_days;
  const when = d < 0 ? Math.abs(d) + ' days late' : d === 0 ? 'today' : d === 1 ? 'tomorrow' : d + ' days';
  w.replaceChildren(el('span', null, next.text), el('span', 'when', when));
  w.hidden = false;
}

/* ------------------------------------------------------------- the wire -- */

function connect() {
  const es = new EventSource('/stream');
  const link = $('#link');

  es.onopen = () => { link.textContent = 'here'; link.classList.remove('down'); };
  es.onerror = () => { link.textContent = 'not running'; link.classList.add('down'); };

  es.addEventListener('ready', e => {
    const s = JSON.parse(e.data);
    stream.replaceChildren();
    for (const m of s.transcript || []) {
      if (m.role === 'user') said(typeof m.content === 'string' ? m.content : '');
      else if (typeof m.content === 'string') turn('heard').appendChild(el('div', 'body', m.content));
    }
    paintState(s.context);
    paintWhisper(s.deadlines);
    if (!(s.transcript || []).length) {
      turn('heard').appendChild(el('div', 'body',
        "I'm here. Tell me what's on your mind, or what you're in the mood for. " +
        'I keep everything and show you almost none of it.'));
    }
    stream.scrollTop = stream.scrollHeight;
  });

  es.addEventListener('text', e => {
    const { delta } = JSON.parse(e.data);
    if (!replying) replying = heard();
    replying.classList.remove('thinking');
    replying.textContent += delta;
    stream.scrollTop = stream.scrollHeight;
  });

  es.addEventListener('tool', e => {
    const t = JSON.parse(e.data);
    const words = {
      remember: 'kept', recall: 'looked back', revise_item: 'updated',
      note_state: 'noted how you are', find_files: 'searched your folders',
      read_file: 'read', change_files: 'file changes'
    };
    doing((words[t.name] || t.name) + (t.detail ? ' · ' + t.detail : ''));
  });

  es.addEventListener('approval', e => { clearPlaceholder(); askApproval(JSON.parse(e.data)); });
  es.addEventListener('state', e => paintState(JSON.parse(e.data)));
  es.addEventListener('error', e => {
    try { doing('trouble: ' + JSON.parse(e.data).message); } catch (err) {}
  });

  es.addEventListener('done', e => {
    const { text, deadlines } = JSON.parse(e.data);
    if (deadlines) paintWhisper(deadlines);
    if (replying && replying.textContent) replying.classList.remove('thinking');
    else clearPlaceholder();
    replying = null;
    busy = false;
    $('#send').disabled = false;
    if (speakAloud && text && window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.98;
      speechSynthesis.speak(u);
    }
  });
}

function send(text) {
  if (!text.trim() || busy) return;
  said(text.trim());
  busy = true;
  $('#send').disabled = true;
  replying = heard();
  fetch('/say', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text: text.trim() })
  }).catch(() => {
    doing('Morrow is not running. Start it in a terminal and reload.');
    busy = false;
    $('#send').disabled = false;
  });
}

/* ---------------------------------------------------------------- voice -- */

function setupVoice() {
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $('#mic');
  if (!Rec) {
    mic.disabled = true;
    mic.title = 'This browser has no speech input. Typing works the same way.';
    return;
  }
  const rec = new Rec();
  rec.continuous = false;
  rec.interimResults = false;
  rec.lang = navigator.language || 'en-GB';
  let listening = false;
  const stop = () => { listening = false; mic.classList.remove('live'); };
  rec.onresult = ev => {
    const heardText = Array.prototype.map.call(ev.results, r => r[0].transcript).join(' ').trim();
    if (heardText) send(heardText);
  };
  rec.onend = stop;
  rec.onerror = stop;
  mic.onclick = () => {
    if (listening) return rec.stop();
    listening = true;
    mic.classList.add('live');
    speakAloud = true;                 // spoken to, spoken back
    $('#speak').classList.add('live');
    try { rec.start(); } catch (e) { stop(); }
  };
}

/* ----------------------------------------------------------------- boot -- */

const form = $('#composer');
const input = $('#input');
form.addEventListener('submit', e => {
  e.preventDefault();
  const v = input.value;
  input.value = '';
  input.style.height = 'auto';
  send(v);
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 176) + 'px';
});
$('#speak').addEventListener('click', function () {
  speakAloud = !speakAloud;
  this.classList.toggle('live', speakAloud);
  if (!speakAloud && window.speechSynthesis) speechSynthesis.cancel();
});
setupVoice();
connect();
input.focus();
</script>
</body>
</html>
